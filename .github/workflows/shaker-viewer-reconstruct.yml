name: Reconstruct Shaker CSV Viewer 1.7

on:
  push:
    branches:
      - csu15-45n-usb
    paths:
      - .github/shaker-viewer-upload/READY

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: csu15-45n-usb
          fetch-depth: 0

      - name: Reconstruct and verify viewer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          upload_dir = Path('.github/shaker-viewer-upload')
          parts = sorted(upload_dir.glob('part-*.b64'))
          if len(parts) != 3:
              raise SystemExit(f'Expected 3 upload parts, found {len(parts)}')

          encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          source = zlib.decompress(base64.b64decode(encoded))

          expected_sha256 = 'f44bc61b6c5c8ff2f12664e8b71e2b3a17fc4b2d9717571b5710209cc03e3fc0'
          actual_sha256 = hashlib.sha256(source).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}'
              )

          target = Path('CSV-Viewer/shaker_csv_viewer.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(source)

          if target.stat().st_size != 77403:
              raise SystemExit(f'Unexpected reconstructed size: {target.stat().st_size}')

          print(f'Reconstructed {target} ({target.stat().st_size} bytes)')
          print(f'SHA-256: {actual_sha256}')
          PY

          python -m py_compile CSV-Viewer/shaker_csv_viewer.py

      - name: Commit viewer update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSV-Viewer/shaker_csv_viewer.py
          if git diff --cached --quiet; then
            echo "Viewer already matches the reconstructed source."
          else
            git commit -m "Add large-file WebGL support to Shaker CSV Viewer"
            git push origin HEAD:csu15-45n-usb
          fi
